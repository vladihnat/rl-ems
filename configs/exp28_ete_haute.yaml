# exp28 — Arbitrage export-timing (Phase D de l'audit exp23→exp27), parité été / non-régression.
# exp27 (PBRS milp_dual @ γ=0.999 + timing_v2) laisse en hiver un gap résiduel = biais « déployer
# trop tôt » : le RL vide la batterie AVANT le pic export du soir alors que le MILP garde le stock
# pour vendre au pic (export > import HP). Cause racine (diagnostic λ(t)) : le dual milp_dual est
# quasi-PLAT (~0.24 « refill ») ⇒ σ·λ = seuil d'export plat, le PBRS ne distingue pas le pic.
# FIX = reward.sigma_hold_export : miroir EXPORT-side de sigma_export_stock, pénalise l'export DE
# STOCK quand un pic export plus haut arrive dans l'horizon (cf. base_microgrid_env._export_hold_cost).
# Été = contrôle de NON-RÉGRESSION (déjà ~1.25 % en exp25/exp27, optimum intérieur pointu) : le
# terme doit être ~inerte ici (pas d'arbitrage export>import massif comme en hiver). Prior doux,
# arm sigma_hold_export=0 = exp27. Base = exp27 été (mêmes données 4j / prix / overfit / milp_dual /
# γ=0.999 / timing_v2). Shaping = train-only ⇒ gap jugé sur net_cost réel vs MILP inchangé.
# Axes (generate_sweep.py) : sigma_hold_export ∈ {0.0, 0.5, 1.0} × sigma_store ∈ {1.0, 1.5} × 3 seeds.
battery:
  pv_charge_mode: surplus
  capacity_kwh: 400.0
  efficiency_charge: 0.9
  efficiency_discharge: 0.9
  init_soc: 0.5
  max_charge_kw: 100.0
  max_discharge_kw: 100.0
  soc_max: 0.9
  soc_min: 0.2
data:
  load_column: Conso_tot
  load_csv: data/load_simu_ete_haute_4d.csv
  pv_column: Global30_kW
  pv_csv: data/irradiance_simu_ete_haute_4d.csv
experiment:
  name: exp28_ete_haute
  seed: 40
grid:
  curtailment: clip
  hc_midday: true
  max_export_kw: 500.0
  max_import_kw: 500.0
  price_hc: 0.1895
  price_hp: 0.2475
  price_type: step_hp_hc
load:
  base_load_kw: 1.0
  type: real
observation:
  load_forecast: true
  price_export_forecast: true
  timing_feature: false
  timing_features_v2: true   # timing_mode=v2 (meilleur exp25)
pv:
  eta_ref: 0.2
  surface_m2: 1600.0
  type: perfect
reward:
  sigma_export_stock: 0.0
  sigma_hold_export: 0.0     # levier exp28 (miroir export) — surchargé par le sweep {0.0,0.5,1.0}
  sigma_soc: 10.0
  sigma_store: 1.0           # meilleur exp27 — surchargé par le sweep {1.0,1.5}
  soc_safe_max: 0.9
  soc_safe_min: 0.2
  spread_penalty: true
  store_value: true
  store_value_mode: milp_dual
time:
  delta_t_min: 15
  horizon_h: 24
training:
  algorithm: SAC
  batch_size: 256
  buffer_size: 750000
  ent_coef: auto
  eval_on_train: true
  gamma: 0.999   # levier dominant exp25
  learning_rate: 0.0003
  learning_starts: 10000
  norm_obs: true
  norm_reward: false
  random_soc: false
  score_days: 2
  split_method: temporal
  total_timesteps: 500000
  train_split: 1.0
  val_split: 0.0
