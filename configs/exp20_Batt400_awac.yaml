# Base du sweep exp20 « AWAC » (washoutBC.md pt 3). Fork d'exp18_Batt400_anchor avec :
#   - training.bc_anchor_awac=true : le terme BC permanent n'est plus une MSE uniforme mais une MSE
#     pondérée par l'avantage critique exp(A(s,a_milp)/β) (cf. agents/bc_sac.BCSAC). L'ancre se
#     relâche là où le critique juge l'action MILP sous-optimale (ex. dump SoC fin de fenêtre du MILP
#     myope) ; elle reste forte là où le MILP est bon.
# Buffer démo + terme BC restent ON (combo gagnant exp18 run_007). generate_sweep.py écrase
# bc_anchor_awac_beta + seed + experiment.name (sweep exp20_awac, 9 runs).
experiment:
  name: exp20_Batt400_awac
  seed: 40

time:
  delta_t_min: 15
  horizon_h: 24

data:
  pv_csv: "data/irradiance_training.csv"
  pv_column: "Global30_kW"
  load_csv: "data/load_training.csv"
  load_column: "Conso_tot"

observation:
  load_forecast: true
  price_export_forecast: true

battery:
  pv_charge_mode: surplus   # pin historique - defaut code = total (flux relache Duchaud-JL)
  capacity_kwh: 400.0
  soc_min: 0.2
  soc_max: 0.9
  max_charge_kw: 100.0
  max_discharge_kw: 100.0
  efficiency_charge: 0.9
  efficiency_discharge: 0.9
  init_soc: 0.5

grid:
  max_import_kw: 500.0
  max_export_kw: 500.0
  curtailment: clip
  price_type: step_hp_hc
  price_hp: 0.2475
  price_hc: 0.1895
  hc_midday: true

load:
  type: real
  base_load_kw: 1.0

pv:
  type: perfect
  surface_m2: 1600.0
  eta_ref: 0.20

reward:
  sigma_soc: 10.0
  soc_safe_min: 0.2
  soc_safe_max: 0.9
  spread_penalty: true
  # PBRS valeur-du-stock (exp19+) — JAMAIS combiné à l'ancre jusqu'ici. Contre le dump précoce
  # (biais d'actualisation), invariant sur l'optimum (télescope en −Φ(s₀)) ⇒ ne casse pas la
  # comparaison MILP. Axe de sweep sigma_store (0.0 = OFF) pour mesurer l'apport ancre+PBRS.
  store_value:  true
  sigma_store:  1.0
  sigma_export_stock: 0.0

training:
  algorithm: SAC
  total_timesteps: 2_000_000
  learning_rate: 0.0003
  batch_size: 256
  buffer_size: 750_000
  gamma: 0.99
  ent_coef: auto
  learning_starts: 10000
  train_split: 0.8
  val_split:   0.2
  split_method: temporal
  random_soc:  false
  norm_obs:    false
  norm_reward: false
  # Behavior cloning depuis le MILP (init de l'acteur, conservée) :
  bc_pretrain_epochs: 300          # init BC (0 = pas de pré-entraînement)
  bc_pretrain_lr:     0.001
  milp_window_days:   1            # taille fenêtre du prof MILP (jours), partagée pretrain+ancre
  warm_start_milp:    false
  # WS-1c — ancre MILP persistante (anti-washout) ; cf. agents/bc_sac.py.
  bc_anchor_demo_buffer: true      # approche 1 : buffer démo dédié (sampling mixte par grad step)
  bc_anchor_demo_frac:   0.25      # fraction du minibatch issue du buffer démo
  bc_anchor_loss:        true      # approche 2 : terme BC permanent dans la loss acteur (TD3+BC)
  bc_anchor_lambda:      1.0       # poids λ du terme BC
  bc_anchor_lambda_final: null     # null = λ constant ; sinon décroissance linéaire λ→λ_final
  bc_anchor_loss_batch:  null      # null = batch_size ; taille du minibatch démo du terme BC
  # AWAC — terme BC pondéré par l'avantage critique ; cf. washoutBC.md pt 3. β est l'axe de sweep.
  bc_anchor_awac:        true      # active la pondération par avantage exp(A/β) du terme BC
  bc_anchor_awac_beta:   1.0       # température β (avantage standardisé → β ~O(1))
  bc_anchor_awac_wmax:   20.0      # clamp du poids exp(A/β) (stabilité numérique)
