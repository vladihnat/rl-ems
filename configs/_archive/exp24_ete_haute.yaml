# exp24 — relâchement de la contrainte no-grid-charging (milpIncoherences.md #5), ETE_HAUTE.
#
# Fork d'exp22_ete_haute (prix fixes 0.15/0.04, overfit train==eval, fenêtre 4 j, score_days 2).
# But : vérification RAPIDE de l'effet du mode de charge batterie sur le gap RL↔MILP, en NE variant
# QUE battery.pv_charge_mode (surplus ↔ total) sur la MEILLEURE config exp22 ete_haute
# (sigma_store=1.0, norm_obs=true, norm_reward=false, seed=42). Pas de sweep complet : le générateur
# n'écrase que pv_charge_mode (+ seed). run_000=surplus, run_001=total.
#
# Régime à PV FORT : c'est le cas où l'écart "charge ≤ surplus" vs "charge ≤ pv" est le plus grand
# en énergie. Rappel : à prix plats (export 0.04 ≪ import 0.15) l'optimum MILP reste ~identique
# (le round-trip perd du rendement sans gain de prix) ⇒ exp24 teste surtout la robustesse du RL à
# l'espace d'action élargi. Le bénéfice économique de #5 exige des prix VARIABLES (suivi à prévoir).
experiment:
  name: exp24_ete_haute
  seed: 42

time:
  delta_t_min: 15
  horizon_h: 24

data:
  pv_csv: "data/irradiance_simu_ete_haute_4d.csv"
  pv_column: "Global30_kW"
  load_csv: "data/load_simu_ete_haute_4d.csv"
  load_column: "Conso_tot"

observation:
  load_forecast: true
  price_export_forecast: false   # no-op sous prix fixes (has_forecast=False) — explicité pour la clarté

battery:
  capacity_kwh: 400.0
  soc_min: 0.2
  soc_max: 0.9
  max_charge_kw: 100.0
  max_discharge_kw: 100.0
  efficiency_charge: 0.9
  efficiency_discharge: 0.9
  init_soc: 0.5
  pv_charge_mode: surplus   # surplus (strict) | total (relâché Duchaud-JL) — écrasé par le sweep

grid:
  max_import_kw: 500.0
  max_export_kw: 500.0
  curtailment: clip
  price_type: fixed
  price_import: 0.15
  price_export: 0.04

load:
  type: real
  base_load_kw: 1.0

pv:
  type: perfect
  surface_m2: 1600.0
  eta_ref: 0.20

reward:
  sigma_soc: 10.0
  soc_safe_min: 0.2
  soc_safe_max: 0.9
  spread_penalty: true
  store_value:  true
  sigma_store:  1.0
  sigma_export_stock: 0.0

training:
  algorithm: SAC
  total_timesteps: 500_000
  learning_rate: 0.0003
  batch_size: 256
  buffer_size: 750_000
  gamma: 0.99
  ent_coef: auto
  learning_starts: 10000
  train_split: 1.0
  val_split:   0.0
  split_method: temporal
  random_soc:  false
  norm_obs:    true
  norm_reward: false
  eval_on_train: true
  score_days:    2
