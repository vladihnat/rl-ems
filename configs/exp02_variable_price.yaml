experiment:
  name: exp02_variable_price
  seed: 42

time:
  delta_t_min: 5
  horizon_h: 6
  # derived: horizon_steps = (horizon_h * 60) / delta_t_min = 72

data:
  pv_csv: "data/Pyrano1w_clean.csv"
  pv_column: "Global30_kW"

battery:
  capacity_kwh: 24.0
  soc_min: 0.2
  soc_max: 0.9
  max_charge_kw: 7.0
  max_discharge_kw: 7.0
  efficiency_charge: 0.9
  efficiency_discharge: 0.9
  init_soc: 0.5

grid:
  max_import_kw: 17.0
  max_export_kw: 17.0
  curtailment: clip
  # Sinusoidal import price: base_import + amplitude * sin(2π * hour / period_h)
  # Mirrors Duchaud-JL: fun_prix_reseau = (5 + sin(t)) for import, 1 for export
  # At noon (hour=6, peak): 0.15 + 0.05 = 0.20 EUR/kWh
  # At midnight (trough):   0.15 - 0.05 = 0.10 EUR/kWh
  price_type: sinusoidal
  base_import: 0.15          # EUR/kWh — mean import price
  amplitude: 0.05            # sinusoidal half-amplitude
  period_h: 24.0             # daily cycle
  base_export: 0.08          # EUR/kWh — flat export/sell price

load:
  type: fixed
  base_load_kw: 1.0

pv:
  type: perfect
  surface_m2: 91.32
  eta_ref: 0.24

reward:
  sigma_soc: 10.0
  soc_safe_min: 0.2
  soc_safe_max: 0.9

training:
  algorithm: SAC
  total_timesteps: 200000
  learning_rate: 0.0003
  batch_size: 256
  buffer_size: 100000
  train_split: 0.8
  split_method: temporal
