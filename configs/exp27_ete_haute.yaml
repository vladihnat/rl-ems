# exp27 — PBRS milp_dual @ γ=0.999 (Phase C de l'audit exp23/exp25/exp26), parité été. Combine les
# DEUX meilleurs leviers restés confondus : le potentiel dual exact (exp26, Φ = σ·λ(t)·(SoC−min)·cap,
# λ(t) = duals du LP à binaires figés, baselines/milp_solver.milp_soc_duals) N'A JAMAIS été testé
# au γ=0.999 qui domine exp25. PBRS pur ⇒ invariant : optimum et comparaison RL↔MILP inchangés,
# SoC₀=0.5 des deux côtés (PAS de random_soc → aucune asymétrie RL↔MILP). Été sert de contrôle
# de non-régression (déjà ~1.25 % en exp25). Base = exp26 été, avec γ=0.999 et timing_v2 fixés.
# Axes (generate_sweep.py) : sigma_store ∈ {0.3, 1.0} × 3 seeds. Contrôle horizon_max = exp25.
battery:
  pv_charge_mode: surplus
  capacity_kwh: 400.0
  efficiency_charge: 0.9
  efficiency_discharge: 0.9
  init_soc: 0.5
  max_charge_kw: 100.0
  max_discharge_kw: 100.0
  soc_max: 0.9
  soc_min: 0.2
data:
  load_column: Conso_tot
  load_csv: data/load_simu_ete_haute_4d.csv
  pv_column: Global30_kW
  pv_csv: data/irradiance_simu_ete_haute_4d.csv
experiment:
  name: exp27_ete_haute
  seed: 40
grid:
  curtailment: clip
  hc_midday: true
  max_export_kw: 500.0
  max_import_kw: 500.0
  price_hc: 0.1895
  price_hp: 0.2475
  price_type: step_hp_hc
load:
  base_load_kw: 1.0
  type: real
observation:
  load_forecast: true
  price_export_forecast: true
  timing_feature: false
  timing_features_v2: true   # timing_mode=v2 (meilleur exp25)
pv:
  eta_ref: 0.2
  surface_m2: 1600.0
  type: perfect
reward:
  sigma_export_stock: 0.0
  sigma_soc: 10.0
  sigma_store: 0.3
  soc_safe_max: 0.9
  soc_safe_min: 0.2
  spread_penalty: true
  store_value: true
  store_value_mode: milp_dual
time:
  delta_t_min: 15
  horizon_h: 24
training:
  algorithm: SAC
  batch_size: 256
  buffer_size: 750000
  ent_coef: auto
  eval_on_train: true
  gamma: 0.999   # levier dominant exp25
  learning_rate: 0.0003
  learning_starts: 10000
  norm_obs: true
  norm_reward: false
  random_soc: false
  score_days: 2
  split_method: temporal
  total_timesteps: 500000
  train_split: 1.0
  val_split: 0.0
