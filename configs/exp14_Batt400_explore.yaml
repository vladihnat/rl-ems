# Base UNIQUE des sweeps "plafond comportemental" (exp14/15/16). Fork VERBATIM d'exp13
# (export forecast + load forecast = signal d'arbitrage, runs faisables) avec 2 changements :
#   1) reward.sigma_bat RETIRÉ : levier mort (r_bat_power est commenté dans base_microgrid_env.py).
#   2) training.learning_starts: 10000 (défaut 100) : warmup aléatoire qui amorce le buffer avec
#      des transitions de charge-depuis-réseau (l'attracteur RL n'en voit jamais → peak_import ~106 kW).
# generate_sweep.py écrase par-dessus gamma/ent_coef (exp14_expl), random_soc (exp15_randsoc) ou
# warm_start_milp (exp16_warmstart), ainsi que experiment.name. NE PAS lancer cette base seule.
experiment:
  name: exp14_Batt400_explore
  seed: 40

time:
  delta_t_min: 15
  horizon_h: 24

data:
  pv_csv: "data/irradiance_training.csv"
  pv_column: "Global30_kW"
  load_csv: "data/load_training.csv"
  load_column: "Conso_tot"

observation:
  load_forecast: true
  price_export_forecast: true      # signal d'arbitrage (grille CoutsProd) — hérité d'exp13

battery:
  capacity_kwh: 400.0
  soc_min: 0.2
  soc_max: 0.9
  max_charge_kw: 500.0
  max_discharge_kw: 500.0
  efficiency_charge: 0.9
  efficiency_discharge: 0.9
  init_soc: 0.5

grid:
  max_import_kw: 500.0
  max_export_kw: 500.0
  curtailment: clip
  price_type: step_hp_hc
  price_hp: 0.2475
  price_hc: 0.1895
  hc_midday: true

load:
  type: real
  base_load_kw: 1.0

pv:
  type: perfect
  surface_m2: 1600.0
  eta_ref: 0.20

reward:
  # sigma_soc / soc_safe_* : INERTES ici (soc_safe = bornes batterie + clip dans battery.step),
  # mais clés REQUISES par base_microgrid_env.py (l.55-57) — gardées telles quelles.
  sigma_soc: 10.0
  soc_safe_min: 0.2
  soc_safe_max: 0.9
  spread_penalty: true
  # sigma_bat retiré (levier mort : r_bat_power commenté dans base_microgrid_env.py).

training:
  algorithm: SAC
  total_timesteps: 2_000_000
  learning_rate: 0.0003
  batch_size: 256
  buffer_size: 750_000
  gamma: 0.99                       # axe de sweep exp14_expl
  ent_coef: auto                    # axe de sweep exp14_expl (auto | 0.1)
  learning_starts: 10000            # vs défaut 100 : warmup pour amorcer la charge-depuis-réseau
  train_split: 0.8
  val_split:   0.2
  split_method: temporal
  random_soc:  false                # axe de sweep exp15_randsoc
  norm_obs:    false
  norm_reward: false
