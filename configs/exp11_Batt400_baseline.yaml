# Baseline corrigée du sweep autour de la batterie 400 kWh (copie d'exp10_Batt400).
# Différences vs exp10 : observations normalisées (norm_obs=true) — correctif clé du gap
# RL/MILP avec 297 features brutes — et bloc training entièrement explicite pour servir de
# base de sweep claire (net_arch, ent_coef, tau, train_freq, gradient_steps).
experiment:
  name: exp_11_Batt400_baseline
  seed: 40

time:
  delta_t_min: 15
  horizon_h: 24                    # report journalier midi->soir (batterie 400 kWh)

data:
  pv_csv: "data/irradiance_training.csv"
  pv_column: "Global30_kW"
  load_csv: "data/load_training.csv"
  load_column: "Conso_tot"

observation:
  load_forecast: true

battery:
  capacity_kwh: 400.0
  soc_min: 0.2
  soc_max: 0.9
  max_charge_kw: 500.0             # 0.25C — absorbe le surplus PV de midi
  max_discharge_kw: 500.0          # 0.25C — couvre la pointe du soir avec l'import reseau
  efficiency_charge: 0.9
  efficiency_discharge: 0.9
  init_soc: 0.5

grid:
  max_import_kw: 500.0
  max_export_kw: 500.0
  curtailment: clip
  price_type: step_hp_hc
  price_hp: 0.2475                 # €/kWh — Tarif Bleu HP TTC Corse (fév 2024)
  price_hc: 0.1895                 # €/kWh — Tarif Bleu HC TTC Corse (fév 2024)
  hc_midday: true

load:
  type: real
  base_load_kw: 1.0

pv:
  type: perfect
  surface_m2: 1600.0
  eta_ref: 0.20

reward:
  sigma_soc: 10.0
  soc_safe_min: 0.2
  soc_safe_max: 0.9
  spread_penalty: true
  sigma_bat: 0.01

training:
  algorithm: SAC
  total_timesteps: 1_000_000
  learning_rate: 0.0003
  batch_size: 256
  buffer_size: 500_000
  gamma: 0.99
  tau: 0.005
  ent_coef: auto
  train_freq: 1
  gradient_steps: 1
  net_arch: [256, 256]             # explicite (= défaut SB3) ; axe de sweep
  train_split: 0.8
  split_method: temporal
  random_soc:  false
  norm_obs:    true                # CORRECTIF CLÉ : normalise les 297 features hétérogènes
  norm_reward: false               # garder le net_cost comparable au MILP
