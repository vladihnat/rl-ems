# exp30 — Les « pauses » du soir + fix deadline (Phase F, audit exp29). Vérification exp29 par
# arm (l'agrégat 4.7→3.3 % vs exp28 est un artefact de composition : exp28 contenait les arms
# σ_store=1.5 nocifs ; l'arm contrôle d'exp29 reproduit EXACTEMENT le best exp28 3.00/2.63/3.48) :
#   - seul l'arm v3=true × σ_charge=1.0 bat le contrôle DANS LES DEUX saisons (hiver 2.96±0.28
#     vs 3.04±0.43 ; été 0.75±0.11 vs 0.82±0.04) — v3 SEUL est nocif (3.69 % hiver), σ_charge
#     seul gonfle la variance (±1.05-1.12) ⇒ on épingle la PAIRE, jamais v3 sans le terme.
#   - le comportement ciblé bouge : L1 charge-timing vs MILP 209→161 kWh (run_011), résiduel
#     matin +2.34→+1.61 €. MAIS les deux modes résiduels se TRADE-OFF entre runs : run_011
#     tient le matin et rate le pic export (27 vs 57 kWh à 0.442, soir +1.87 €) ; run_013 capte
#     le pic (56.8 kWh) et garde le biais matin (+2.09 €). Aucun run ne tient les deux = la
#     vraie frontière du gap hiver (~2.2-3 %).
# DEUX leviers exp30 (sweep 2×3×3, arm (false, 0) = contrôle = 3 seeds FRAIS du winner exp29
# ⇒ règle aussi la significativité n=3) :
#   1. reward.sigma_discharge_hold : 4e miroir SERVE-side. Le MILP importe 2 pas à HP 0.2475
#      pour TENIR le stock jusqu'au pic 21:45/0.442 ; le RL sert la charge depuis la batterie et
#      arrive au pic à moitié vide. oc_serve = max(0, max(export_fc) − p_imp_now), appliqué à la
#      part batterie→charge seule (l'export est couvert par σ_hold), cf.
#      base_microgrid_env._discharge_hold_cost. ⚠ résidu sur l'optimum PLUS GROS que les autres
#      miroirs (le MILP sert aussi la charge pré-pic quand le stock excède le livrable à 100 kW
#      pendant le pic) ⇒ prior TRÈS doux, σ ∈ {0, 0.25, 0.5}.
#   2. reward.charge_hold_deadline : borne le min faisable charge-side au prochain pic export
#      (argmax(export_fc)) — la charge prépare CE pic ; la fenêtre bon marché du LENDEMAIN
#      (chevauchement horizon 24 h) contaminait oc_charge sur des pas optimaux, suspect n°1 de
#      la variance des arms σ_charge sans v3. S'applique au helper ⇒ cohérent reward + obs v3.
# Base = exp29 hiver, winner épinglé : timing_features_v3=true + σ_charge=1.0 (la paire), sur
# les pins exp28 (σ_hold=0.5, σ_store=1.0, milp_dual, γ=0.999, surplus, overfit 4 j).
# Axes (generate_sweep.py) : charge_hold_deadline ∈ {false,true} × sigma_discharge_hold ∈ {0.0, 0.25, 0.5} × seeds {43,44,45}.
battery:
  pv_charge_mode: surplus   # pin comparabilite exp25..exp29 (defaut code = total)
  capacity_kwh: 400.0
  efficiency_charge: 0.9
  efficiency_discharge: 0.9
  init_soc: 0.5
  max_charge_kw: 100.0
  max_discharge_kw: 100.0
  soc_max: 0.9
  soc_min: 0.2
data:
  load_column: Conso_tot
  load_csv: data/simu/load_simu_hiver_haute_4d.csv
  pv_column: Global30_kW
  pv_csv: data/simu/irradiance_simu_hiver_haute_4d.csv
experiment:
  name: exp30_hiver_haute
  seed: 43
grid:
  curtailment: clip
  hc_midday: true
  max_export_kw: 500.0
  max_import_kw: 500.0
  price_hc: 0.1895
  price_hp: 0.2475
  price_type: step_hp_hc
load:
  base_load_kw: 1.0
  type: real
observation:
  load_forecast: true
  price_export_forecast: true
  timing_feature: false
  timing_features_v2: true   # timing_mode=v2 (meilleur exp25, épinglé depuis exp27)
  timing_features_v3: true   # winner exp29 (PAIRE avec sigma_charge_hold=1.0 — jamais v3 seul)
pv:
  eta_ref: 0.2
  surface_m2: 1600.0
  type: perfect
reward:
  charge_hold_deadline: false  # levier exp30 (fix chevauchement 24h) — surchargé par le sweep {false,true}
  sigma_charge_hold: 1.0     # winner exp29 (paire avec timing_features_v3=true)
  sigma_discharge_hold: 0.0  # levier exp30 (miroir serve-side) — surchargé par le sweep {0.0,0.25,0.5}
  sigma_export_stock: 0.0
  sigma_hold_export: 0.5     # meilleur exp28 (bras stable 3.00/2.63/3.48 sur 3 seeds)
  sigma_soc: 10.0
  sigma_store: 1.0           # meilleur exp28 (σ=1.5 dégrade TOUS les bras : seuil σ·λ trop haut)
  soc_safe_max: 0.9
  soc_safe_min: 0.2
  spread_penalty: true
  store_value: true
  store_value_mode: milp_dual
time:
  delta_t_min: 15
  horizon_h: 24
training:
  algorithm: SAC
  batch_size: 256
  buffer_size: 750000
  ent_coef: auto
  eval_on_train: true
  gamma: 0.999   # levier dominant exp25 (0.999^84 ≈ 0.92 : le pic du soir reste visible de t0)
  learning_rate: 0.0003
  learning_starts: 10000
  norm_obs: true
  norm_reward: false
  random_soc: false
  score_days: 2
  split_method: temporal
  total_timesteps: 500000
  train_split: 1.0
  val_split: 0.0
