# exp30 — Les « pauses » du soir + fix deadline (Phase F, audit exp29), volet été. Vérification
# exp29 par arm : l'arm contrôle été = 0.82±0.04, seul v3=true × σ_charge=1.0 l'améliore
# (0.75±0.11, best run 0.63 % — vs 0.70 % exp28) ; même conclusion qu'en hiver : épingler la
# PAIRE. En été le résiduel restant est plus petit en relatif (~0.7-0.8 %) mais comparable en
# ABSOLU (~5 €/2 j vs ~5 € hiver) et de même nature (audit exp28 run_010 : +3.8 € matin
# « charger trop tôt » partiellement traité par exp29, +3.0 € soir pauses manquantes NON
# traité). exp30 attaque le soir + fiabilise le terme charge :
#   1. reward.sigma_discharge_hold : 4e miroir SERVE-side (oc_serve = max(0, max(export_fc) −
#      p_imp_now), part batterie→charge seule, cf. base_microgrid_env._discharge_hold_cost).
#      Prior TRÈS doux (le MILP sert aussi la charge pré-pic), σ ∈ {0, 0.25, 0.5}.
#   2. reward.charge_hold_deadline : min faisable borné au prochain pic export (fix
#      chevauchement 24 h du lendemain, cf. _feasible_charge_export_min) — reward + obs v3.
# Arm (false, 0) = contrôle = 3 seeds FRAIS du winner exp29 (significativité n=3 réglée au
# passage). Base = exp29 été, winner épinglé (v3=true + σ_charge=1.0) sur les pins exp28
# (σ_hold=0.5, σ_store=1.0, milp_dual, γ=0.999, surplus, overfit 4 j).
# Axes (generate_sweep.py) : charge_hold_deadline ∈ {false,true} × sigma_discharge_hold ∈ {0.0, 0.25, 0.5} × seeds {43,44,45}.
battery:
  pv_charge_mode: surplus
  capacity_kwh: 400.0
  efficiency_charge: 0.9
  efficiency_discharge: 0.9
  init_soc: 0.5
  max_charge_kw: 100.0
  max_discharge_kw: 100.0
  soc_max: 0.9
  soc_min: 0.2
data:
  load_column: Conso_tot
  load_csv: data/simu/load_simu_ete_haute_4d.csv
  pv_column: Global30_kW
  pv_csv: data/simu/irradiance_simu_ete_haute_4d.csv
experiment:
  name: exp30_ete_haute
  seed: 43
grid:
  curtailment: clip
  hc_midday: true
  max_export_kw: 500.0
  max_import_kw: 500.0
  price_hc: 0.1895
  price_hp: 0.2475
  price_type: step_hp_hc
load:
  base_load_kw: 1.0
  type: real
observation:
  load_forecast: true
  price_export_forecast: true
  timing_feature: false
  timing_features_v2: true   # timing_mode=v2 (meilleur exp25, épinglé depuis exp27)
  timing_features_v3: true   # winner exp29 (PAIRE avec sigma_charge_hold=1.0 — jamais v3 seul)
pv:
  eta_ref: 0.2
  surface_m2: 1600.0
  type: perfect
reward:
  charge_hold_deadline: false  # levier exp30 (fix chevauchement 24h) — surchargé par le sweep {false,true}
  sigma_charge_hold: 1.0     # winner exp29 (paire avec timing_features_v3=true)
  sigma_discharge_hold: 0.0  # levier exp30 (miroir serve-side) — surchargé par le sweep {0.0,0.25,0.5}
  sigma_export_stock: 0.0
  sigma_hold_export: 0.5     # épinglé comme le pin hiver (comparabilité exp28/29)
  sigma_soc: 10.0
  sigma_store: 1.0           # meilleur exp28 (σ=1.5 dégrade tous les bras)
  soc_safe_max: 0.9
  soc_safe_min: 0.2
  spread_penalty: true
  store_value: true
  store_value_mode: milp_dual
time:
  delta_t_min: 15
  horizon_h: 24
training:
  algorithm: SAC
  batch_size: 256
  buffer_size: 750000
  ent_coef: auto
  eval_on_train: true
  gamma: 0.999   # levier dominant exp25
  learning_rate: 0.0003
  learning_starts: 10000
  norm_obs: true
  norm_reward: false
  random_soc: false
  score_days: 2
  split_method: temporal
  total_timesteps: 500000
  train_split: 1.0
  val_split: 0.0
