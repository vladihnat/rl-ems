# Base des sweeps Behavior Cloning (exp17). Fork VERBATIM d'exp14_Batt400_explore avec, en plus :
#   - training.bc_pretrain_epochs : pré-entraînement supervisé de l'acteur sur le dispatch MILP
#     (régression atanh ; cf. agents/sac_agent._bc_pretrain_actor) AVANT le RL → injecte la
#     charge-depuis-réseau dans les poids (non dilué, contrairement au warm_start buffer).
#   - training.bc_pretrain_lr / milp_window_days : lr du BC et taille fenêtre du prof MILP (jours).
# Validé en local : le BC seul SORT de l'attracteur (test peak >> 106 kW). Risque connu : le RL
# vanilla peut « laver » le BC → combiner avec warm_start_milp et/ou ent_coef plus bas.
# generate_sweep.py écrase bc_pretrain_epochs / warm_start_milp / seed + experiment.name.
experiment:
  name: exp17_Batt400_bc
  seed: 40

time:
  delta_t_min: 15
  horizon_h: 24

data:
  pv_csv: "data/irradiance_training.csv"
  pv_column: "Global30_kW"
  load_csv: "data/load_training.csv"
  load_column: "Conso_tot"

observation:
  load_forecast: true
  price_export_forecast: true

battery:
  pv_charge_mode: surplus   # pin historique - defaut code = total (flux relache Duchaud-JL)
  capacity_kwh: 400.0
  soc_min: 0.2
  soc_max: 0.9
  max_charge_kw: 500.0
  max_discharge_kw: 500.0
  efficiency_charge: 0.9
  efficiency_discharge: 0.9
  init_soc: 0.5

grid:
  max_import_kw: 500.0
  max_export_kw: 500.0
  curtailment: clip
  price_type: step_hp_hc
  price_hp: 0.2475
  price_hc: 0.1895
  hc_midday: true

load:
  type: real
  base_load_kw: 1.0

pv:
  type: perfect
  surface_m2: 1600.0
  eta_ref: 0.20

reward:
  sigma_soc: 10.0
  soc_safe_min: 0.2
  soc_safe_max: 0.9
  spread_penalty: true

training:
  algorithm: SAC
  total_timesteps: 2_000_000
  learning_rate: 0.0003
  batch_size: 256
  buffer_size: 750_000
  gamma: 0.99
  ent_coef: auto
  learning_starts: 10000
  train_split: 0.8
  val_split:   0.2
  split_method: temporal
  random_soc:  false
  norm_obs:    false
  norm_reward: false
  # Behavior cloning depuis le MILP :
  bc_pretrain_epochs: 300          # axe de sweep exp17 (0 = pas de BC)
  bc_pretrain_lr:     0.001
  milp_window_days:   1            # taille fenêtre du prof MILP (jours)
  warm_start_milp:    false        # axe de sweep exp17 (buffer prefill, complémentaire du BC)
