experiment:
  name: exp09_corseTarif
  seed: 42

time:
  delta_t_min: 15
  horizon_h: 6

data:
  pv_csv: "data/irradiance_training.csv"
  pv_column: "Global30_kW"
  load_csv: "data/load_training.csv"
  load_column: "Conso_tot"

observation:
  load_forecast: true

battery:
  capacity_kwh: 24.0
  soc_min: 0.2
  soc_max: 0.9
  max_charge_kw: 7.0
  max_discharge_kw: 7.0
  efficiency_charge: 0.9
  efficiency_discharge: 0.9
  init_soc: 0.5

grid:
  max_import_kw: 17.0
  max_export_kw: 17.0
  curtailment: clip
  # Import : modèle 2 (HP/HC + créneau midi). Export : grille CoutsProd (saison/heure/jour).
  price_type: step_hp_hc           # ou step_pointe pour le modèle 1
  price_hp: 0.2475                 # €/kWh — Tarif Bleu HP TTC Corse (fév 2024)
  price_hc: 0.1895                 # €/kWh — Tarif Bleu HC TTC Corse (fév 2024)
  hc_midday: true                  # activer le créneau HC 12h-15h | modele 3 
  # --- modèle 1 (step_pointe) : décommenter et remplacer le bloc ci-dessus ---
  # price_type: step_pointe
  # price_hc: 0.19                  # HC nuit  [23h, 7h[
  # price_hp: 0.25                  # HP journée [7h, 18h[ ∪ [22h, 23h[
  # price_pointe: 0.35             # Pointe soir [18h, 22h[

load:
  type: real
  base_load_kw: 1.0

pv:
  type: perfect
  surface_m2: 91.32
  eta_ref: 0.24

reward:
  sigma_soc: 10.0
  soc_safe_min: 0.2
  soc_safe_max: 0.9
  spread_penalty: true
  sigma_bat: 0.01

training:
  algorithm: SAC
  total_timesteps: 1000000
  learning_rate: 0.0003
  batch_size: 256
  buffer_size: 300_000
  gamma: 0.99
  train_split: 0.8
  split_method: temporal
  random_soc:  false
  norm_obs:    false
  norm_reward: false
